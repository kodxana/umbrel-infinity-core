# Infinity Core for umbrelOS (community integration)
# Vendor Docker guide: https://github.com/tekchansin/Infinity-Homeassistant
# Linux amd64 only. Host networking enables local device discovery.
# Core serves TCP 8930 (web UI) and TCP 8931 (LAN client).
# mDNS/DNS-SD: UDP 5353, 224.0.0.251, service _infinitylink._tcp.
# Infinity Link peer streaming: TCP 4720; peer Wi-Fi Transfer: TCP 8910.
# Those peer ports do not imply the Core server listens on both ports.
# With network_mode: host, do not add Docker ports: mappings.

services:
  server:
    image: ghcr.io/tekchansin/infinity-core:beta
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 60s

    # ALSA reads /proc/asound/cards to enumerate sound cards. Docker masks
    # /proc/asound by default even when /dev/snd is mounted. Unmask the
    # container's system paths without using privileged mode. NOTE: this also
    # unmasks other protected /proc and /sys paths; see README security notes.
    # Do NOT bind-mount /proc/asound into /proc: runc rejects that mount.
    security_opt:
      - systempaths=unconfined

    environment:
      INFINITY_NAME: "Infinity Core on Umbrel"
      TZ: "Etc/UTC"

    volumes:
      # Persistent library database, artwork cache, settings and updates.
      - ${APP_DATA_DIR}/data:/data:rw

      # Default music location. A folder chosen in Umbrel App Settings >
      # Storage > Music Library is mounted at /music by folderAccess.
      # Write access is needed for upstream music sync and optional tag edits.
      - ${UMBREL_ROOT}/data/storage/downloads/music:/music:rw

      # ALSA sound devices and the USB bus, including hot-plugged devices.
      # Device permissions are scoped by class; privileged mode is disabled.
      - /dev/snd:/dev/snd:rw
      - /dev/bus/usb:/dev/bus/usb:rw

    device_cgroup_rules:
      - 'c 116:* rwm'  # ALSA sound cards
      - 'c 189:* rwm'  # USB bus devices

# No app_proxy or ports: upstream listens directly on TCP 8930/8931 and
# uses mDNS/SSDP with host networking. Do not expose these ports to the internet.
